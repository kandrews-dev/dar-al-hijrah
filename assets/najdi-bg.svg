<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <g fill="none" stroke="#7a3a14" stroke-width="1.2" opacity="0.07" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Crenellation top band -->
    <path d="M0 12 L12 12 L12 0 L28 0 L28 12 L44 12 L44 0 L60 0 L60 12 L76 12 L76 0 L92 0 L92 12 L108 12 L108 0 L124 0 L124 12 L140 12 L140 0 L156 0 L156 12 L172 12 L172 0 L188 0 L188 12 L200 12"/>
    <!-- Crenellation bottom band -->
    <path d="M0 188 L12 188 L12 200 L28 200 L28 188 L44 188 L44 200 L60 200 L60 188 L76 188 L76 200 L92 200 L92 188 L108 188 L108 200 L124 200 L124 188 L140 188 L140 200 L156 200 L156 188 L172 188 L172 200 L188 200 L188 188 L200 188"/>
    <!-- Zigzag row -->
    <polyline points="0,40 14,30 28,40 42,30 56,40 70,30 84,40 98,30 112,40 126,30 140,40 154,30 168,40 182,30 196,40 200,38"/>
    <polyline points="0,160 14,170 28,160 42,170 56,160 70,170 84,160 98,170 112,160 126,170 140,160 154,170 168,160 182,170 196,160 200,162"/>
    <!-- Triangle row -->
